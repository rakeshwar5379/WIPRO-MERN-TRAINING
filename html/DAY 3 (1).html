<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Flowers School Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            padding: 20px;
            background-color: #fff;
        }

        .main-header {
            background-color: #6ab4f1;
            border: 1px solid #333;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 60px;
            background: #fff;
            border: 1px solid #888;
            padding: 4px;
        }

        .school-title {
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .nav-menu button {
            background: #fff;
            border: 1px solid #333;
            padding: 7px 14px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-menu button:hover {
            background: #eee;
        }

        .app-container {
            background-color: #6ab4f1;
            border: 1px solid #333;
            min-height: 450px;
            padding: 50px;
            position: relative;
        }

        #welcome-view {
            text-align: center;
            margin-top: 100px;
        }

        #profile-view {
            display: none;
            flex-wrap: wrap;
            gap: 40px;
            align-items: center;
        }

        .student-img-circle {
            width: 250px;
            height: 250px;
            border: 1px solid #333;
            border-radius: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .student-img-circle img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        .details-panel h2 {
            font-size: 26px;
            margin-bottom: 10px;
            text-decoration: underline;
        }

        .details-panel p {
            font-size: 19px;
            line-height: 2;
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="brand">
        <img src="https://cdn.vectorstock.com/i/1000x1000/21/54/education-school-logo-design-vector-44972154.webp"
             alt="Logo"
             class="logo">
        <span class="school-title">Spring Flowers School</span>
    </div>

    <nav class="nav-menu">
        <button onclick="showHome()">Home</button>
        <button onclick="showProfile()">Student Profile</button>
    </nav>
</header>

<main class="app-container">

    <div id="welcome-view">
        <h1>Welcome to Spring Flowers School</h1>
        <p>Please use the menu above to navigate.</p>
    </div>

    <div id="profile-view">
        <div class="student-img-circle">
            <img
                src="https://clipart-library.com/images_k/student-boy-cliparts/student-boy-cliparts-20.png"
                alt="Student Image">
        </div>

        <div class="details-panel">
            <h2>Student Information</h2>
            <p><strong>Name:</strong> Rakeshwar B</p>
            <p><strong>Class:</strong> 12</p>
            <p><strong>Student ID:</strong> 1324</p>
        </div>
    </div>

</main>

<script>
    function showProfile() {
        document.getElementById('welcome-view').style.display = 'none';
        document.getElementById('profile-view').style.display = 'flex';
    }

    function showHome() {
        document.getElementById('profile-view').style.display = 'none';
        document.getElementById('welcome-view').style.display = 'block';
    }
</script>

</body>
</html>
